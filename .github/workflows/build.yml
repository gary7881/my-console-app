name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build gateway
        run: dotnet build MyConsoleApp.csproj --configuration Release

      - name: Build backend service
        run: dotnet build MyBackendService/MyBackendService.csproj --configuration Release